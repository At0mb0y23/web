<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>輕鐵及九巴到站時間</title>
<style>
  html, body {
    background-color: #000000;
    color: #FFFFFF;
    font-family: "Helvetica Neue", "PingFang HK", "Heiti TC", sans-serif;
    margin: 0;
    padding: 10px 15px 50px 15px; /* 保留底部空間防止 Safari 導覽列遮擋 */
    width: 100%;
    height: 100%;
    overflow: hidden; /* 徹底禁止整頁滾動 */
    position: fixed;   /* 鎖死畫面防止 iOS 彈性滑動 */
    box-sizing: border-box;
  }
  .header {
    border-bottom: 3px solid #D3A809;
    padding-bottom: 8px;
    margin-bottom: 10px;
  }
  .header-row-top {
    overflow: hidden;
    margin-bottom: 4px;
  }
  .station-title {
    float: left;
    font-size: 26px;
    font-weight: bold;
    color: #FFD700;
    cursor: pointer;
    line-height: 38px;
  }
  .header-right {
    float: right;
  }
  .btn-settings {
    background: #222222;
    color: #FFD700;
    border: 1px solid #D3A809;
    border-radius: 6px;
    padding: 5px 12px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }
  
  /* 獨立一行的特大時鐘 (使用與其他文字相同的字體) */
  .header-row-clock {
    text-align: center;
    border-top: 1px solid #222222;
    padding-top: 6px;
    margin-top: 4px;
  }
  .clock {
    font-size: 56px;
    color: #00FF66;
    font-weight: bold;
    display: inline-block;
    line-height: 1.1;
  }

  .filter-badges {
    text-align: center;
    margin-top: 2px;
  }
  .badge {
    display: inline-block;
    background: #222222;
    border: 1px solid #555555;
    color: #00BFFF;
    font-size: 13px;
    padding: 2px 6px;
    border-radius: 4px;
    margin: 0 3px;
  }

  /* 區塊樣式 */
  .section-box {
    margin-bottom: 12px;
    background: #111111;
    border: 1px solid #333333;
    border-radius: 8px;
    padding: 8px 16px;
  }
  .section-title-lrt {
    font-size: 20px;
    color: #00BFFF;
    font-weight: bold;
    margin-bottom: 4px;
    border-bottom: 1px solid #333333;
    padding-bottom: 3px;
  }
  .section-title-kmb {
    font-size: 20px;
    color: #FF4D4D;
    font-weight: bold;
    margin-bottom: 4px;
    border-bottom: 1px solid #333333;
    padding-bottom: 3px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  td {
    padding: 5px 0;
    font-size: 28px;
    font-weight: bold;
    border-bottom: 1px dashed #222222;
  }
  tr:last-child td {
    border-bottom: none;
  }
  .route {
    width: 18%;
    color: #FFD700;
  }
  .kmb-route {
    width: 18%;
    color: #FF5555;
  }
  .dest {
    width: 47%;
    color: #FFFFFF;
  }
  .cars {
    width: 15%;
    font-size: 18px;
    color: #AAAAAA;
    text-align: center;
  }
  /* 輕鐵車卡長方形圖示 */
  .train-car {
    display: inline-block;
    width: 26px;
    height: 15px;
    background-color: #FFD700;
    border: 2px solid #FFFFFF;
    border-radius: 3px;
    margin: 0 2px;
    vertical-align: middle;
  }
  .time {
    width: 20%;
    text-align: right;
    color: #00FF66;
  }
  .status-bar {
    position: fixed;
    bottom: 4px;
    right: 15px;
    font-size: 12px;
    color: #666666;
  }

  /* 設定彈出視窗 */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.88);
    z-index: 999;
    overflow-y: auto;
  }
  .modal-box {
    background: #1A1A1A;
    border: 2px solid #D3A809;
    border-radius: 10px;
    width: 88%;
    max-width: 720px;
    margin: 20px auto;
    padding: 18px 22px;
    color: #FFFFFF;
  }
  .modal-title {
    font-size: 24px;
    font-weight: bold;
    color: #FFD700;
    margin-bottom: 12px;
    border-bottom: 1px solid #444;
    padding-bottom: 8px;
  }
  .sub-header {
    font-size: 20px;
    font-weight: bold;
    color: #00BFFF;
    margin: 15px 0 10px 0;
    padding-left: 8px;
    border-left: 4px solid #00BFFF;
  }
  .sub-header.kmb {
    color: #FF5555;
    border-left-color: #FF5555;
  }
  .form-group {
    margin-bottom: 14px;
  }
  .form-label {
    display: block;
    font-size: 16px;
    color: #CCCCCC;
    margin-bottom: 6px;
    font-weight: bold;
  }
  select, input[type="text"] {
    width: 100%;
    padding: 9px;
    font-size: 18px;
    background: #000000;
    color: #FFFFFF;
    border: 1px solid #555555;
    border-radius: 6px;
    box-sizing: border-box;
  }
  .chip-group {
    overflow: hidden;
  }
  .chip {
    display: inline-block;
    background: #000000;
    border: 1px solid #555555;
    color: #CCCCCC;
    padding: 7px 14px;
    margin-right: 6px;
    margin-bottom: 6px;
    border-radius: 6px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
  }
  .chip.active {
    background: #D3A809;
    color: #000000;
    border-color: #FFD700;
  }
  .kmb-builder {
    background: #111111;
    border: 1px solid #444444;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 12px;
  }
  .kmb-saved-item {
    background: #222222;
    border: 1px solid #444444;
    border-radius: 6px;
    padding: 8px 12px;
    margin-bottom: 6px;
    font-size: 18px;
    overflow: hidden;
  }
  .kmb-saved-text {
    float: left;
    line-height: 30px;
  }
  .btn-del {
    float: right;
    background: #AA2222;
    color: #FFFFFF;
    border: none;
    border-radius: 4px;
    padding: 4px 12px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }
  .btn-small {
    background: #D3A809;
    color: #000000;
    border: none;
    border-radius: 6px;
    padding: 9px 16px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
  }
  .btn-add-kmb {
    background: #FF4D4D;
    color: #FFFFFF;
    border: none;
    border-radius: 6px;
    padding: 9px 18px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 8px;
    width: 100%;
  }
  .modal-actions {
    text-align: right;
    margin-top: 18px;
    border-top: 1px solid #333;
    padding-top: 14px;
  }
  .btn {
    padding: 9px 20px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    margin-left: 8px;
  }
  .btn-cancel { background: #444444; color: #FFFFFF; }
  .btn-reset { background: #8B0000; color: #FFFFFF; float: left; margin-left: 0; }
  .btn-save { background: #00CC52; color: #000000; }
</style>
</head>
<body>

<div class="header">
  <div class="header-row-top">
    <div class="station-title" id="stationName" onclick="openSettings()">輕鐵 + 九巴班次</div>
    <div class="header-right">
      <button class="btn-settings" onclick="openSettings()">⚙ 設定</button>
    </div>
  </div>
  <div class="header-row-clock">
    <div class="clock" id="clock">--:--:--</div>
  </div>
  <div class="filter-badges" id="filterBadges"></div>
</div>

<!-- 輕鐵顯示區 -->
<div id="lrtContent"></div>

<!-- 九巴顯示區 -->
<div id="kmbContent"></div>

<div class="status-bar" id="status">最後更新: --</div>

<!-- 設定視窗 -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal-box">
    <div class="modal-title">顯示屏設定 (輕鐵 & 九巴)</div>

    <!-- 顯示模式切換 -->
    <div class="form-group">
      <label class="form-label">畫面顯示內容：</label>
      <div class="chip-group" id="modeChips">
        <span class="chip active" data-mode="BOTH" onclick="selectMode('BOTH')">輕鐵 + 九巴</span>
        <span class="chip" data-mode="LRT" onclick="selectMode('LRT')">只看輕鐵</span>
        <span class="chip" data-mode="KMB" onclick="selectMode('KMB')">只看九巴</span>
      </div>
    </div>

    <!-- ================= 九巴設定區 ================= -->
    <div class="sub-header kmb">九巴 (KMB) 路線及車站設定</div>
    <div class="kmb-builder">
      <div class="form-group">
        <label class="form-label">步驟 1：輸入九巴路線號碼 (例如 60M, 60X, 258D, 961)</label>
        <div style="overflow:hidden;">
          <input type="text" id="kmbRouteInput" placeholder="輸入路線號碼，如 258D" style="width:65%; float:left; text-transform:uppercase;">
          <button class="btn-small" onclick="searchKmbRoute()" style="width:32%; float:right;">搜尋方向</button>
        </div>
        <div id="kmbSearchMsg" style="color:#FFD700; font-size:15px; margin-top:5px;"></div>
      </div>

      <div class="form-group" id="kmbDirGroup" style="display:none;">
        <label class="form-label">步驟 2：選擇行車方向 (Direction)</label>
        <select id="kmbDirSelect" onchange="loadKmbStops()"></select>
      </div>

      <div class="form-group" id="kmbStopGroup" style="display:none;">
        <label class="form-label">步驟 3：選擇巴士站 (Station)</label>
        <select id="kmbStopSelect"></select>
        <button class="btn-add-kmb" onclick="addKmbWatch()">＋ 加入此九巴站到主畫面</button>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">已加入的九巴路線 / 車站：</label>
      <div id="kmbSavedList"></div>
    </div>

    <!-- ================= 輕鐵設定區 ================= -->
    <div class="sub-header">輕鐵 (LRT) 車站及篩選設定</div>
    <div class="form-group">
      <label class="form-label">1. 選擇輕鐵站：</label>
      <select id="stationSelect"></select>
    </div>

    <div class="form-group">
      <label class="form-label">2. 顯示月台 (不選代表全部)：</label>
      <div class="chip-group" id="platformChips">
        <span class="chip" data-plat="1" onclick="toggleChip(this)">1 號月台</span>
        <span class="chip" data-plat="2" onclick="toggleChip(this)">2 號月台</span>
        <span class="chip" data-plat="3" onclick="toggleChip(this)">3 號月台</span>
        <span class="chip" data-plat="4" onclick="toggleChip(this)">4 號月台</span>
        <span class="chip" data-plat="5" onclick="toggleChip(this)">5 號月台</span>
        <span class="chip" data-plat="6" onclick="toggleChip(this)">6 號月台</span>
        <span class="chip" data-plat="7" onclick="toggleChip(this)">7 號月台</span>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">3. 篩選輕鐵路線 (用逗號分隔，留空顯示全部)：</label>
      <input type="text" id="routeInput" placeholder="例如: 505, 507, 751">
      <div class="chip-group" id="quickRouteChips" style="margin-top: 6px;"></div>
    </div>

    <div class="form-group">
      <label class="form-label">4. 輕鐵車卡數目篩選：</label>
      <div class="chip-group" id="carLengthChips">
        <span class="chip active" data-len="0" onclick="selectCarLen(0)">全部</span>
        <span class="chip" data-len="1" onclick="selectCarLen(1)">只看單卡 (1卡)</span>
        <span class="chip" data-len="2" onclick="selectCarLen(2)">只看拖卡 (2卡)</span>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">5. 每月台 / 每路線最多顯示班次：</label>
      <select id="maxRowsSelect">
        <option value="2">2 班車</option>
        <option value="3">3 班車 (推薦)</option>
        <option value="4">4 班車</option>
      </select>
    </div>

    <div class="modal-actions">
      <button class="btn btn-reset" onclick="resetFilters()">重置全部</button>
      <button class="btn btn-cancel" onclick="closeSettings()">取消</button>
      <button class="btn btn-save" onclick="saveSettings()">儲存並套用</button>
    </div>
  </div>
</div>

<script>
var STATIONS = [
  {id: "270", name: "安定 (On Ting)"},
  {id: "275", name: "友愛 (Yau Oi)"},
  {id: "280", name: "市中心 (Town Centre)"},
  {id: "260", name: "豐景園 (Goodview Garden)"},
  {id: "250", name: "屯門泳池 (Tuen Mun Swimming Pool)"},
  {id: "240", name: "兆麟 (Siu Lun)"},
  {id: "265", name: "三聖 (Sam Shing)"},
  {id: "1",   name: "屯門碼頭 (Tuen Mun Ferry Pier)"},
  {id: "10",  name: "美樂 (Melody Garden)"},
  {id: "15",  name: "蝴蝶 (Wu Tip)"},
  {id: "20",  name: "輕鐵車廠 (Light Rail Depot)"},
  {id: "30",  name: "龍門 (Lung Mun)"},
  {id: "40",  name: "青山村 (Tsing Shan Tsuen)"},
  {id: "50",  name: "青雲 (Tsing Wun)"},
  {id: "60",  name: "建安 (Kin On)"},
  {id: "295", name: "屯門 (Tuen Mun)"},
  {id: "300", name: "杯渡 (Pui To)"},
  {id: "310", name: "何福堂 (Ho Fuk Tong)"},
  {id: "320", name: "新墟 (San Hui)"},
  {id: "330", name: "景峰 (Prime View)"},
  {id: "340", name: "鳳地 (Fung Tei)"},
  {id: "70",  name: "河田 (Ho Tin)"},
  {id: "75",  name: "蔡意橋 (Choy Yee Bridge)"},
  {id: "80",  name: "澤豐 (Affluence)"},
  {id: "90",  name: "屯門醫院 (Tuen Mun Hospital)"},
  {id: "100", name: "兆康 (Siu Hong)"},
  {id: "110", name: "麒麟 (Kei Lun)"},
  {id: "120", name: "青松 (Ching Chung)"},
  {id: "130", name: "建生 (Kin Sang)"},
  {id: "140", name: "田景 (Tin King)"},
  {id: "150", name: "良景 (Leung King)"},
  {id: "160", name: "新圍 (San Wai)"},
  {id: "170", name: "石排 (Shek Pai)"},
  {id: "180", name: "山景(北) (Shan King North)"},
  {id: "190", name: "山景(南) (Shan King South)"},
  {id: "200", name: "鳴琴 (Ming Kum)"},
  {id: "212", name: "大興(北) (Tai Hing North)"},
  {id: "220", name: "大興(南) (Tai Hing South)"},
  {id: "230", name: "銀圍 (Ngan Wai)"},
  {id: "350", name: "藍地 (Lam Tei)"},
  {id: "360", name: "泥圍 (Nai Wai)"},
  {id: "370", name: "鍾屋村 (Chung Uk Tsuen)"},
  {id: "380", name: "洪水橋 (Hung Shui Kiu)"},
  {id: "390", name: "塘坊村 (Tong Fong Tsuen)"},
  {id: "400", name: "屏山 (Ping Shan)"},
  {id: "425", name: "坑尾村 (Hang Mei Tsuen)"},
  {id: "430", name: "天水圍 (Tin Shui Wai)"},
  {id: "435", name: "天慈 (Tin Tsz)"},
  {id: "445", name: "天耀 (Tin Yiu)"},
  {id: "448", name: "樂湖 (Locwood)"},
  {id: "450", name: "天湖 (Tin Wu)"},
  {id: "455", name: "銀座 (Ginza)"},
  {id: "460", name: "天瑞 (Tin Shui)"},
  {id: "468", name: "頌富 (Chung Fu)"},
  {id: "480", name: "天富 (Tin Fu)"},
  {id: "490", name: "翠湖 (Chestwood)"},
  {id: "500", name: "天榮 (Tin Wing)"},
  {id: "510", name: "天悅 (Tin Yuet)"},
  {id: "520", name: "天秀 (Tin Sau)"},
  {id: "530", name: "濕地公園 (Wetland Park)"},
  {id: "540", name: "天恒 (Tin Heng)"},
  {id: "550", name: "天逸 (Tin Yat)"},
  {id: "560", name: "水邊圍 (Shui Pin Wai)"},
  {id: "570", name: "豐年路 (Fung Nin Road)"},
  {id: "580", name: "康樂路 (Hong Lok Road)"},
  {id: "590", name: "大棠路 (Tai Tong Road)"},
  {id: "600", name: "元朗 (Yuen Long)"}
];

var ALL_ROUTES = ["505", "507", "610", "614", "614P", "615", "615P", "751", "705", "706", "761P"];

var config = {
  displayMode: "BOTH",
  stationId: "270",
  platforms: [],
  routes: [],
  carLength: 0,
  maxRows: 3,
  kmbWatches: []
};

var tempKmbDirections = [];
var tempKmbStops = [];
var kmbEtaCache = {};
var stopNameCache = {};

function loadConfig() {
  try {
    var saved = localStorage.getItem("lrt_kmb_config_v2");
    if (saved) {
      var parsed = JSON.parse(saved);
      config.displayMode = parsed.displayMode || "BOTH";
      config.stationId = parsed.stationId || "270";
      config.platforms = parsed.platforms || [];
      config.routes = parsed.routes || [];
      config.carLength = parsed.carLength || 0;
      config.maxRows = parsed.maxRows || 3;
      config.kmbWatches = parsed.kmbWatches || [];
    }
  } catch (e) {}
}

function saveConfigToStorage() {
  try {
    localStorage.setItem("lrt_kmb_config_v2", JSON.stringify(config));
  } catch (e) {}
}

function getStationName(id) {
  for (var i = 0; i < STATIONS.length; i++) {
    if (STATIONS[i].id === id) return STATIONS[i].name.split(" ")[0] + "站";
  }
  return "車站 " + id;
}

function initSettingsUI() {
  var sel = document.getElementById("stationSelect");
  var opts = "";
  for (var i = 0; i < STATIONS.length; i++) {
    opts += '<option value="' + STATIONS[i].id + '">' + STATIONS[i].name + '</option>';
  }
  sel.innerHTML = opts;

  var rChips = document.getElementById("quickRouteChips");
  var rHtml = "";
  for (var j = 0; j < ALL_ROUTES.length; j++) {
    var r = ALL_ROUTES[j];
    rHtml += '<span class="chip" onclick="toggleRouteQuick(\'' + r + '\')" id="qroute_' + r + '">' + r + '</span>';
  }
  rChips.innerHTML = rHtml;
}

function updateHeaderUI() {
  var titleText = "";
  if (config.displayMode === "LRT") {
    titleText = "輕鐵 " + getStationName(config.stationId);
  } else if (config.displayMode === "KMB") {
    titleText = "九巴即時到站時間";
  } else {
    titleText = "輕鐵 " + getStationName(config.stationId) + " + 九巴";
  }
  document.getElementById("stationName").innerHTML = titleText;

  var badgesHtml = "";
  if (config.displayMode !== "KMB") {
    if (config.platforms && config.platforms.length > 0) {
      badgesHtml += '<span class="badge">月台: ' + config.platforms.join(", ") + '</span>';
    }
    if (config.routes && config.routes.length > 0) {
      badgesHtml += '<span class="badge">輕鐵: ' + config.routes.join(", ") + '</span>';
    }
  }
  if (config.displayMode !== "LRT" && config.kmbWatches.length > 0) {
    badgesHtml += '<span class="badge" style="color:#FF6666;">九巴: ' + config.kmbWatches.length + ' 條路線</span>';
  }
  document.getElementById("filterBadges").innerHTML = badgesHtml;
}

function searchKmbRoute() {
  var route = document.getElementById("kmbRouteInput").value.replace(/\s+/g, "").toUpperCase();
  document.getElementById("kmbRouteInput").value = route;
  if (!route) {
    document.getElementById("kmbSearchMsg").innerHTML = "請輸入九巴路線號碼！";
    return;
  }

  document.getElementById("kmbSearchMsg").innerHTML = "正在搜尋路線 " + route + " 的方向...";
  document.getElementById("kmbDirGroup").style.display = "none";
  document.getElementById("kmbStopGroup").style.display = "none";
  tempKmbDirections = [];

  checkKmbBound(route, "outbound", function() {
    checkKmbBound(route, "inbound", function() {
      if (tempKmbDirections.length === 0) {
        document.getElementById("kmbSearchMsg").innerHTML = "找不到九巴路線 " + route + "，請確認號碼是否正確。";
      } else {
        document.getElementById("kmbSearchMsg").innerHTML = "";
        var dirSel = document.getElementById("kmbDirSelect");
        var opts = "";
        for (var i = 0; i < tempKmbDirections.length; i++) {
          var d = tempKmbDirections[i];
          opts += '<option value="' + i + '">往 ' + d.dest_tc + ' (由 ' + d.orig_tc + ' 開出)</option>';
        }
        dirSel.innerHTML = opts;
        document.getElementById("kmbDirGroup").style.display = "block";
        loadKmbStops();
      }
    });
  });
}

function checkKmbBound(route, directionStr, callback) {
  var xhr = new XMLHttpRequest();
  var url = "https://data.etabus.gov.hk/v1/transport/kmb/route/" + route + "/" + directionStr + "/1";
  xhr.open("GET", url, true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4) {
      if (xhr.status === 200) {
        try {
          var res = JSON.parse(xhr.responseText);
          if (res && res.data && res.data.route) {
            tempKmbDirections.push({
              route: res.data.route,
              bound: res.data.bound,
              dirStr: directionStr,
              serviceType: res.data.service_type || "1",
              orig_tc: res.data.orig_tc,
              dest_tc: res.data.dest_tc
            });
          }
        } catch (e) {}
      }
      callback();
    }
  };
  xhr.send();
}

function loadKmbStops() {
  var idx = parseInt(document.getElementById("kmbDirSelect").value, 10);
  var dirObj = tempKmbDirections[idx];
  if (!dirObj) return;

  document.getElementById("kmbSearchMsg").innerHTML = "正在載入車站列表...";
  document.getElementById("kmbStopGroup").style.display = "none";

  var xhr = new XMLHttpRequest();
  var url = "https://data.etabus.gov.hk/v1/transport/kmb/route-stop/" + dirObj.route + "/" + dirObj.dirStr + "/" + dirObj.serviceType;
  xhr.open("GET", url, true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4) {
      if (xhr.status === 200) {
        try {
          var res = JSON.parse(xhr.responseText);
          var list = res.data || [];
          if (list.length === 0) {
            document.getElementById("kmbSearchMsg").innerHTML = "此方向暫無車站資料";
            return;
          }
          fetchStopNamesSequentially(list, dirObj);
        } catch (e) {
          document.getElementById("kmbSearchMsg").innerHTML = "解析車站失敗";
        }
      } else {
        document.getElementById("kmbSearchMsg").innerHTML = "讀取車站失敗";
      }
    }
  };
  xhr.send();
}

function fetchStopNamesSequentially(routeStopList, dirObj) {
  tempKmbStops = [];
  var total = routeStopList.length;
  var completed = 0;

  for (var i = 0; i < total; i++) {
    (function(index) {
      var item = routeStopList[index];
      var stopId = item.stop;
      if (stopNameCache[stopId]) {
        tempKmbStops[index] = { seq: item.seq, stopId: stopId, name_tc: stopNameCache[stopId] };
        completed++;
        if (completed === total) finishKmbStopsRender();
      } else {
        var xhr = new XMLHttpRequest();
        xhr.open("GET", "https://data.etabus.gov.hk/v1/transport/kmb/stop/" + stopId, true);
        xhr.onreadystatechange = function() {
          if (xhr.readyState === 4) {
            var nameTc = stopId;
            if (xhr.status === 200) {
              try {
                var sData = JSON.parse(xhr.responseText);
                if (sData && sData.data && sData.data.name_tc) {
                  nameTc = sData.data.name_tc;
                  stopNameCache[stopId] = nameTc;
                }
              } catch (e) {}
            }
            tempKmbStops[index] = { seq: item.seq, stopId: stopId, name_tc: nameTc };
            completed++;
            if (completed === total) finishKmbStopsRender();
          }
        };
        xhr.send();
      }
    })(i);
  }
}

function finishKmbStopsRender() {
  document.getElementById("kmbSearchMsg").innerHTML = "";
  var stopSel = document.getElementById("kmbStopSelect");
  var opts = "";
  for (var i = 0; i < tempKmbStops.length; i++) {
    var s = tempKmbStops[i];
    if (s) {
      opts += '<option value="' + i + '">' + s.seq + '. ' + s.name_tc + '</option>';
    }
  }
  stopSel.innerHTML = opts;
  document.getElementById("kmbStopGroup").style.display = "block";
}

function addKmbWatch() {
  var dirIdx = parseInt(document.getElementById("kmbDirSelect").value, 10);
  var stopIdx = parseInt(document.getElementById("kmbStopSelect").value, 10);
  var dirObj = tempKmbDirections[dirIdx];
  var stopObj = tempKmbStops[stopIdx];
  if (!dirObj || !stopObj) return;

  var cleanStopName = stopObj.name_tc.replace(/\s*\([A-Z0-9]+\)\s*$/, "");

  config.kmbWatches.push({
    route: dirObj.route,
    bound: dirObj.bound,
    serviceType: dirObj.serviceType,
    stopId: stopObj.stopId,
    stopName: cleanStopName,
    destName: dirObj.dest_tc
  });

  renderSavedKmbList();
  document.getElementById("kmbSearchMsg").innerHTML = "已加入：" + dirObj.route + " 往" + dirObj.dest_tc + " (" + cleanStopName + ")";
}

function removeKmbWatch(index) {
  config.kmbWatches.splice(index, 1);
  renderSavedKmbList();
}

function renderSavedKmbList() {
  var container = document.getElementById("kmbSavedList");
  if (!config.kmbWatches || config.kmbWatches.length === 0) {
    container.innerHTML = '<div style="color:#777; font-size:16px;">尚未加入任何九巴路線 (可在上方搜尋並加入)</div>';
    return;
  }
  var html = "";
  for (var i = 0; i < config.kmbWatches.length; i++) {
    var w = config.kmbWatches[i];
    html += '<div class="kmb-saved-item">';
    html += '<div class="kmb-saved-text"><strong style="color:#FF5555;">' + w.route + '</strong> 往 ' + w.destName + ' ＠ <span style="color:#FFD700;">' + w.stopName + '</span></div>';
    html += '<button class="btn-del" onclick="removeKmbWatch(' + i + ')">刪除</button>';
    html += '</div>';
  }
  container.innerHTML = html;
}

function selectMode(mode) {
  var mChips = document.getElementById("modeChips").getElementsByTagName("span");
  for (var i = 0; i < mChips.length; i++) {
    mChips[i].className = (mChips[i].getAttribute("data-mode") === mode) ? "chip active" : "chip";
  }
}

function openSettings() {
  selectMode(config.displayMode);
  document.getElementById("stationSelect").value = config.stationId;
  document.getElementById("maxRowsSelect").value = String(config.maxRows);

  var pChips = document.getElementById("platformChips").getElementsByTagName("span");
  for (var i = 0; i < pChips.length; i++) {
    var pVal = pChips[i].getAttribute("data-plat");
    pChips[i].className = arrayContains(config.platforms, pVal) ? "chip active" : "chip";
  }

  document.getElementById("routeInput").value = config.routes.join(", ");
  syncQuickRouteChips();
  selectCarLen(config.carLength);
  renderSavedKmbList();

  document.getElementById("settingsModal").style.display = "block";
}

function closeSettings() {
  document.getElementById("settingsModal").style.display = "none";
}

function toggleChip(el) {
  el.className = (el.className.indexOf("active") !== -1) ? "chip" : "chip active";
}

function selectCarLen(len) {
  var cChips = document.getElementById("carLengthChips").getElementsByTagName("span");
  for (var i = 0; i < cChips.length; i++) {
    var val = parseInt(cChips[i].getAttribute("data-len"), 10);
    cChips[i].className = (val === len) ? "chip active" : "chip";
  }
}

function parseRouteInput() {
  var raw = document.getElementById("routeInput").value.toUpperCase();
  var parts = raw.split(",");
  var clean = [];
  for (var i = 0; i < parts.length; i++) {
    var s = parts[i].replace(/^\s+|\s+$/g, "");
    if (s && !arrayContains(clean, s)) clean.push(s);
  }
  return clean;
}

function syncQuickRouteChips() {
  var currentRoutes = parseRouteInput();
  for (var i = 0; i < ALL_ROUTES.length; i++) {
    var r = ALL_ROUTES[i];
    var el = document.getElementById("qroute_" + r);
    if (el) el.className = arrayContains(currentRoutes, r) ? "chip active" : "chip";
  }
}

function toggleRouteQuick(routeNo) {
  var currentRoutes = parseRouteInput();
  var nextRoutes = [];
  var found = false;
  for (var i = 0; i < currentRoutes.length; i++) {
    if (currentRoutes[i] === routeNo) found = true;
    else nextRoutes.push(currentRoutes[i]);
  }
  if (!found) nextRoutes.push(routeNo);
  document.getElementById("routeInput").value = nextRoutes.join(", ");
  syncQuickRouteChips();
}

function resetFilters() {
  selectMode("BOTH");
  var pChips = document.getElementById("platformChips").getElementsByTagName("span");
  for (var i = 0; i < pChips.length; i++) pChips[i].className = "chip";
  document.getElementById("routeInput").value = "";
  syncQuickRouteChips();
  selectCarLen(0);
  document.getElementById("maxRowsSelect").value = "3";
  config.kmbWatches = [];
  renderSavedKmbList();
}

function saveSettings() {
  var mChips = document.getElementById("modeChips").getElementsByTagName("span");
  for (var m = 0; m < mChips.length; m++) {
    if (mChips[m].className.indexOf("active") !== -1) {
      config.displayMode = mChips[m].getAttribute("data-mode");
    }
  }

  config.stationId = document.getElementById("stationSelect").value;

  var selectedPlats = [];
  var pChips = document.getElementById("platformChips").getElementsByTagName("span");
  for (var i = 0; i < pChips.length; i++) {
    if (pChips[i].className.indexOf("active") !== -1) {
      selectedPlats.push(pChips[i].getAttribute("data-plat"));
    }
  }
  config.platforms = selectedPlats;
  config.routes = parseRouteInput();

  var cChips = document.getElementById("carLengthChips").getElementsByTagName("span");
  for (var j = 0; j < cChips.length; j++) {
    if (cChips[j].className.indexOf("active") !== -1) {
      config.carLength = parseInt(cChips[j].getAttribute("data-len"), 10);
    }
  }

  config.maxRows = parseInt(document.getElementById("maxRowsSelect").value, 10) || 3;

  saveConfigToStorage();
  updateHeaderUI();
  closeSettings();
  refreshAll();
}

function arrayContains(arr, val) {
  if (!arr) return false;
  for (var i = 0; i < arr.length; i++) {
    if (String(arr[i]).toUpperCase() === String(val).toUpperCase()) return true;
  }
  return false;
}

function updateClock() {
  var now = new Date();
  var h = ("0" + now.getHours()).slice(-2);
  var m = ("0" + now.getMinutes()).slice(-2);
  var s = ("0" + now.getSeconds()).slice(-2);
  document.getElementById("clock").innerHTML = h + ":" + m + ":" + s;
}

function refreshAll() {
  if (config.displayMode === "KMB") {
    document.getElementById("lrtContent").innerHTML = "";
  } else {
    fetchLrtSchedule();
  }

  if (config.displayMode === "LRT") {
    document.getElementById("kmbContent").innerHTML = "";
  } else {
    fetchAllKmbEta();
  }
}

function fetchLrtSchedule() {
  var xhr = new XMLHttpRequest();
  var url = "https://rt.data.gov.hk/v1/transport/mtr/lrt/getSchedule?station_id=" + config.stationId + "&t=" + new Date().getTime();
  xhr.open("GET", url, true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4 && xhr.status === 200) {
      try {
        var data = JSON.parse(xhr.responseText);
        renderLrtData(data);
        document.getElementById("status").innerHTML = "最後更新: " + data.system_time;
      } catch (e) {}
    }
  };
  xhr.send();
}

function renderLrtData(data) {
  if (!data || !data.platform_list || data.platform_list.length === 0) {
    document.getElementById("lrtContent").innerHTML = '<div class="section-box">暫無輕鐵班次資料</div>';
    return;
  }

  var html = "";
  for (var i = 0; i < data.platform_list.length; i++) {
    var plat = data.platform_list[i];
    var platIdStr = String(plat.platform_id);

    if (config.platforms.length > 0 && !arrayContains(config.platforms, platIdStr)) continue;

    html += '<div class="section-box">';
    html += '<div class="section-title-lrt">輕鐵 ' + getStationName(config.stationId) + ' - ' + platIdStr + ' 號月台</div>';
    html += '<table>';

    var filteredRoutes = [];
    if (plat.route_list && plat.route_list.length > 0) {
      for (var j = 0; j < plat.route_list.length; j++) {
        var r = plat.route_list[j];
        if (config.routes.length > 0 && !arrayContains(config.routes, r.route_no)) continue;
        if (config.carLength > 0 && r.train_length !== config.carLength) continue;
        filteredRoutes.push(r);
      }
    }

    if (filteredRoutes.length > 0) {
      var maxRows = Math.min(filteredRoutes.length, config.maxRows);
      for (var k = 0; k < maxRows; k++) {
        var item = filteredRoutes[k];
        var carHtml = "";
        if (item.train_length === 2) {
          carHtml = '<span class="train-car"></span><span class="train-car"></span>';
        } else if (item.train_length === 1) {
          carHtml = '<span class="train-car"></span>';
        }
        html += '<tr>';
        html += '<td class="route">' + item.route_no + '</td>';
        html += '<td class="dest">往 ' + (item.dest_ch || "") + '</td>';
        html += '<td class="cars">' + carHtml + '</td>';
        html += '<td class="time">' + (item.time_ch || "-") + '</td>';
        html += '</tr>';
      }
    } else {
      html += '<tr><td colspan="4" style="color:#777;font-size:22px;">沒有符合條件的班次</td></tr>';
    }
    html += '</table></div>';
  }
  document.getElementById("lrtContent").innerHTML = html;
}

function fetchAllKmbEta() {
  if (!config.kmbWatches || config.kmbWatches.length === 0) {
    if (config.displayMode === "KMB") {
      document.getElementById("kmbContent").innerHTML = '<div class="section-box"><div style="font-size:24px;color:#FFD700;">請點擊右上角「⚙ 設定」加入九巴路線及車站</div></div>';
    } else {
      document.getElementById("kmbContent").innerHTML = "";
    }
    return;
  }

  var total = config.kmbWatches.length;
  var done = 0;

  for (var i = 0; i < total; i++) {
    (function(idx) {
      var w = config.kmbWatches[idx];
      var xhr = new XMLHttpRequest();
      var url = "https://data.etabus.gov.hk/v1/transport/kmb/eta/" + w.stopId + "/" + w.route + "/" + w.serviceType + "?t=" + new Date().getTime();
      xhr.open("GET", url, true);
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
          if (xhr.status === 200) {
            try {
              var res = JSON.parse(xhr.responseText);
              var list = res.data || [];
              var matching = [];
              for (var j = 0; j < list.length; j++) {
                if (list[j].dir === w.bound && list[j].eta) {
                  matching.push(list[j]);
                }
              }
              kmbEtaCache[idx] = matching;
            } catch (e) {
              kmbEtaCache[idx] = [];
            }
          }
          done++;
          if (done === total) {
            renderKmbData();
            var now = new Date();
            document.getElementById("status").innerHTML = "最後更新: " + ("0"+now.getHours()).slice(-2) + ":" + ("0"+now.getMinutes()).slice(-2) + ":" + ("0"+now.getSeconds()).slice(-2);
          }
        }
      };
      xhr.send();
    })(i);
  }
}

function formatKmbMinutes(etaIsoStr) {
  var etaTime = Date.parse(etaIsoStr);
  if (isNaN(etaTime)) return "-";
  var nowTime = new Date().getTime();
  var diffMin = Math.floor((etaTime - nowTime) / 60000);
  if (diffMin <= 0) return "即將抵達";
  return diffMin + " 分鐘";
}

function renderKmbData() {
  var html = '<div class="section-box">';
  html += '<div class="section-title-kmb">九巴即時班次 (KMB)</div>';
  html += '<table>';

  for (var i = 0; i < config.kmbWatches.length; i++) {
    var w = config.kmbWatches[i];
    var etas = kmbEtaCache[i] || [];

    if (etas.length > 0) {
      var maxRows = Math.min(etas.length, config.maxRows);
      for (var k = 0; k < maxRows; k++) {
        var item = etas[k];
        var minStr = formatKmbMinutes(item.eta);
        var rmks = item.rmk_tc ? item.rmk_tc : (k === 0 ? "頭班" : "隨後");
        html += '<tr>';
        html += '<td class="kmb-route">' + w.route + '</td>';
        html += '<td class="dest">往 ' + w.destName + ' <span style="font-size:18px;color:#FFD700;">(' + w.stopName + ')</span></td>';
        html += '<td class="cars">' + rmks + '</td>';
        html += '<td class="time">' + minStr + '</td>';
        html += '</tr>';
      }
    } else {
      html += '<tr>';
      html += '<td class="kmb-route">' + w.route + '</td>';
      html += '<td class="dest">往 ' + w.destName + ' <span style="font-size:18px;color:#FFD700;">(' + w.stopName + ')</span></td>';
      html += '<td class="cars" colspan="2" style="text-align:right;color:#777;">暫無班次</td>';
      html += '</tr>';
    }
  }

  html += '</table></div>';
  document.getElementById("kmbContent").innerHTML = html;
}

document.getElementById("routeInput").onkeyup = syncQuickRouteChips;

loadConfig();
initSettingsUI();
updateHeaderUI();
updateClock();
setInterval(updateClock, 1000);
refreshAll();
setInterval(refreshAll, 20000);
</script>
</body>
</html>
